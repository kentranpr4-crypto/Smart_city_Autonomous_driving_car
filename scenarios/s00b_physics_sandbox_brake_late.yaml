# Physics sandbox S00b: same geometry, brake issued LATE. Physics (not a script) decides the outcome.
schema_version: "0.1.0"
id: s00b_brake_late
description: "Scripted emergency brake at t=1.5 s; stopping distance (9.45 m) exceeds remaining gap, so contact is expected with residual speed."
dt: 0.01
duration: 8.0
stop_when_all_stopped: true
road: {mu: 0.8}
vehicles:
  - id: ego
    init: {x: 0.0, y: 0.0, psi: 0.0, v: 8.333333333333334}
    script:
      - {t: 1.5, a_cmd: -6.0, delta_cmd: 0.0, mode: emergency}
pedestrians:
  - id: ped1
    radius: 0.3
    path: [[25.0, -3.0], [25.0, 3.0]]
    start_time: {dist: uniform, low: 1.5, high: 2.5}
    speed: {dist: uniform, low: 1.2, high: 1.6}
