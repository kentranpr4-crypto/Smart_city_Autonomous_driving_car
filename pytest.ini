[pytest]
testpaths = tests
addopts = -ra -q
markers =
    phy: physics acceptance gate (PHY-xx)
    trk: tracker acceptance (AC-VS-03 and association/stale/failure-mode tests)
    iso: ground-truth isolation (AC-VS-06 / I9)
    com: WP3 communication gate (COM-xx)
    fus: WP4 cooperative fusion gate (FUS-xx)
    known_failure: documented, expected-to-fail behaviour (xfail strict)
filterwarnings = error
